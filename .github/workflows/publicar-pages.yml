# Despliegue propio del Observatorio en GitHub Pages (reemplaza al automatico «pages build and
# deployment» de la fuente «rama»). Autorizado por el usuario en el chat de #1 el 2026-11-06, tras
# E-019: ese dia el despliegue automatico se corto 6 veces (4 por el tope fijo de 10 min y 2 con
# «Deployment failed, try again later»).
#
# - Timeout de despliegue de 30 min y tolerancia alta a errores pasajeros del servicio.
# - Una sola corrida a la vez; un push nuevo espera en cola y no cancela la que esta desplegando.
# - Se puede relanzar a mano desde Actions («Run workflow») sin commits vacios.
# - El sitio es estatico: no hay build. Se sube la raiz del repo tal cual (sin .git ni .github).
#
# - Reintento dentro de la misma corrida (autorizado por el usuario en el chat de #1 el 2026-11-24, tras
#   E-030): si el despliegue falla, espera 90 s y repite la subida y el despliegue, hasta 3 intentos.
#   Cada reintento sube el artefacto con otro nombre, porque un nombre ya usado no se puede repetir
#   en la misma corrida. El fallo del primer intento queda a la vista como aviso de la corrida.
# - Pausa de 20 s entre cada subida y su despliegue (autorizada por el usuario en el chat de #1 el
#   2026-11-25). Hipotesis, no probada: GitHub tarda un instante en dejar visible el artefacto recien
#   subido. La corrida 294 (24-11 20:49) fallo los 3 intentos con «No artifacts named ... were found»
#   y el despliegue partio en el mismo segundo en que termino la subida.
#
# Lo mantiene #1. publicar_web.py excluye .github del espejo, asi que este archivo vive solo aqui.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.despliegue3.outputs.page_url || steps.despliegue2.outputs.page_url || steps.despliegue1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Pausa antes del despliegue 1
        run: sleep 20
      - id: despliegue1
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 1800000
          error_count: 20

      - name: Esperar antes del intento 2
        if: steps.despliegue1.outcome == 'failure'
        run: |
          echo "::warning::El despliegue fallo en el intento 1; se reintenta en 90 s."
          sleep 90
      - if: steps.despliegue1.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-2
          path: .
      - name: Pausa antes del despliegue 2
        if: steps.despliegue1.outcome == 'failure'
        run: sleep 20
      - id: despliegue2
        if: steps.despliegue1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-2
          timeout: 1800000
          error_count: 20

      - name: Esperar antes del intento 3
        if: steps.despliegue2.outcome == 'failure'
        run: |
          echo "::warning::El despliegue fallo en el intento 2; se reintenta en 90 s."
          sleep 90
      - if: steps.despliegue2.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-3
          path: .
      - name: Pausa antes del despliegue 3
        if: steps.despliegue2.outcome == 'failure'
        run: sleep 20
      - id: despliegue3
        if: steps.despliegue2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-3
          timeout: 1800000
          error_count: 20
